---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: persistent-prober
  namespace: kube-prometheus-stack

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: persistent-prober
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: persistent-prober
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: persistent-prober
subjects:
- kind: ServiceAccount
  name: persistent-prober
  namespace: kube-prometheus-stack

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: persistent-prober
  name: persistent-prober
  namespace: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: persistent-prober
  template:
    metadata:
      labels:
        app: persistent-prober
    spec:
      serviceAccount: persistent-prober
      serviceAccountName: persistent-prober
      containers:
      - name: persistent-prober
        image: docker.io/cbaker090/persistent-prober:latest
        ports:
        - containerPort: 9060
          protocol: TCP
          name: prometheus
        - containerPort: 9061
          protocol: TCP
          name: echo
        - containerPort: 53
          protocol: UDP
          name: dns
        resources:
          limits:
            cpu: 250m
            memory: 512M
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthy
            port: 9060
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 15
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: 9060
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 15
        env:
        - name: SERVICE_SELECTOR_NAMESPACE
          value: "kube-prometheus-stack"
        - name: SERVICE_SELECTOR
          value: "app=persistent-prober"
        - name: METRICS_BIND_ADDRESS
          value: ":9060"
        - name: TCP_ECHO_BIND_ADDRESS
          value: ":9061"
        - name: DNS_ECHO_BIND_ADDRESS
          value: ":53"
        - name: LOG_LEVEL
          value: "debug"
        - name: DISCOVERY_START_DELAY
          value: "30s"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
          

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: persistent-prober
  name: persistent-prober
  namespace: kube-prometheus-stack
spec:
  type: NodePort
  ports:
  - name: echo
    port: 9061
    protocol: TCP
    targetPort: 9061
  selector:
    app: persistent-prober


---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    release: kube-prometheus-stack
  name: persistent-prober
  namespace: kube-prometheus-stack
spec:
  podMetricsEndpoints:
  - port: prometheus
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      action: replace
      targetLabel: node
  namespaceSelector:
    matchNames:
    - kube-prometheus-stack
  selector:
    matchLabels:
      app: persistent-prober
